# =============================================================================
# Snishaper-Droid-Native · Android CI
#
# 流程：checkout → JDK 25 → Android SDK（runner 预装 + sdkmanager 直装）→
# Go 1.27 → gomobile/gobind（固定版本）→ gomobile bind 生成 AAR →
# verify_aar.py 契约校验 → gradlew lint test assembleDebug → 上传 artifacts
#
# 与 Snishaper-Droid 的差异：无 WebView 前端（无 Node 步骤）、无 CLA/bot 状态机。
# =============================================================================
name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  COMPILE_SDK: "37"
  COMPILE_SDK_MINOR: "2"
  BUILD_TOOLS: "37.0.0"
  NDK_VERSION: "30.0.16248370"
  GOMOBILE_VERSION: "v0.0.0-20260803200217-62cee1672c8e"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: AAR + APK
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 25 (build JDK)
        id: jdk25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Use JDK 25 as JAVA_HOME
        run: echo "JAVA_HOME=${{ steps.jdk25.outputs.java-home }}" >> "$GITHUB_ENV"

      - name: Setup Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Android SDK components (NDK / platform / build-tools)
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-${{ env.COMPILE_SDK }}.${{ env.COMPILE_SDK_MINOR }}
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.BUILD_TOOLS }}
          key: android-sdk-v1-${{ runner.os }}-api${{ env.COMPILE_SDK }}.${{ env.COMPILE_SDK_MINOR }}-bt${{ env.BUILD_TOOLS }}-ndk${{ env.NDK_VERSION }}
          restore-keys: |
            android-sdk-v1-${{ runner.os }}-

      - name: Cache gomobile toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/go/bin/gomobile
            ~/go/bin/gobind
          key: gomobile-${{ runner.os }}-${{ env.GOMOBILE_VERSION }}
          restore-keys: |
            gomobile-${{ runner.os }}-

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('gomobile/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      - name: Install Android SDK components (preinstalled SDK on the runner)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)" || {
              echo "::error::sdkmanager not found on the runner"; exit 1;
            }
          fi
          echo "Using sdkmanager: ${SDKMANAGER}"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}.${COMPILE_SDK_MINOR}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: gomobile/go.sum

      - name: Check gcc (cgo toolchain)
        run: gcc --version

      - name: Install gomobile + gobind (pinned version)
        run: |
          set -euo pipefail
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Use official Maven / Gradle repositories in CI
        run: |
          set -euo pipefail
          sed -i '/repo\.huaweicloud\.com/d' settings.gradle.kts
          sed -i 's#repo\.huaweicloud\.com/gradle#services.gradle.org/distributions#g' \
            gradle/wrapper/gradle-wrapper.properties || true

      - name: Build AAR
        run: |
          set -euo pipefail
          mkdir -p core/engine/libs
          cd gomobile
          go mod tidy
          gomobile bind \
            -target=android/arm64 \
            -androidapi 24 \
            -tags with_gvisor \
            -trimpath \
            -ldflags="-s -w" \
            -javapkg com.snishaper.core \
            -o ../core/engine/libs/snishaper-core.aar \
            ./mobile
          cd ..
          ls -lh core/engine/libs/snishaper-core.aar

      - name: Verify AAR contract (ABI / minSdk / 16KB)
        run: python3 scripts/verify_aar.py --abis arm64-v8a

      - name: Extract AAR (classes.jar + jniLibs) for the engine module
        run: ./scripts/extract-aar.sh

      - name: Build (lint / test / assembleDebug arm64)
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace lint test assembleDebug -PdebugAbi=arm64-v8a

      - name: Upload APK/AAR
        uses: actions/upload-artifact@v7
        with:
          name: snishaper-droid-native-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            core/engine/libs/snishaper-core.aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint/test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-reports-${{ github.run_number }}
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.txt
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
